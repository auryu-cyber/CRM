var currentLang = 'ja';

function t(key) {
  return (I18N[currentLang] && I18N[currentLang][key] !== undefined)
    ? I18N[currentLang][key]
    : (I18N['en'] && I18N['en'][key] !== undefined ? I18N['en'][key] : key);
}

function setLang(lang) {
  if (!I18N[lang]) return;
  currentLang = lang;
  try { localStorage.setItem('crm_lang', lang); } catch(e){}
  document.documentElement.lang = lang;
  applyTranslations();
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
    el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
  });
  document.querySelectorAll('.lang-tab').forEach(function(tab) {
    tab.classList.toggle('active', tab.dataset.lang === currentLang);
  });
  if (typeof renderCurrentPage === 'function') renderCurrentPage();
}
