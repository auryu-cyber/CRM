<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM System - Kunomura (Preview)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>

/* ============================================================
   CRM System - Stylesheet (RFQ Split-Panel + Responsive)
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --primary:#1a73e8; --primary-dark:#1557b0; --primary-light:#e8f0fe;
  --green:#137333;   --green-light:#e6f4ea;
  --yellow:#e37400;  --yellow-light:#fef9e7;
  --red:#c5221f;     --red-light:#fce8e6;
  --purple:#6f3fbd;  --purple-light:#f3e8fd;
  --text:#202124;    --text2:#5f6368;  --border:#dadce0;
  --bg:#f8f9fa;      --card:#ffffff;
  --sidebar-w:220px; --header-h:56px;
  --shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
  --shadow-md:0 4px 12px rgba(0,0,0,.15);
  --radius:8px; --trans:.18s ease;
}

html,body{height:100%;font-family:'Noto Sans JP','Noto Sans Thai',Arial,sans-serif;
  font-size:13px;color:var(--text);background:var(--bg);line-height:1.5}

/* ---- LAYOUT ---- */
.app-wrapper{display:flex;height:100vh;overflow:hidden}

/* ---- SIDEBAR ---- */
.sidebar{width:var(--sidebar-w);height:100vh;background:var(--card);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:fixed;left:0;top:0;z-index:200;transition:transform var(--trans);overflow-y:auto}

.sidebar-logo{display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--border);min-height:var(--header-h)}
.logo-icon{width:30px;height:30px;background:var(--primary);border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.logo-text{font-size:14px;font-weight:600;line-height:1.2}
.logo-sub{font-size:10px;color:var(--text2)}

.sidebar-nav{flex:1;padding:6px 0}
.nav-section-label{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;
  letter-spacing:.8px;padding:10px 16px 4px}

.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;
  border-radius:0 20px 20px 0;margin-right:10px;color:var(--text2);
  transition:background var(--trans),color var(--trans);
  font-size:13px;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--bg);color:var(--primary)}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.nav-icon{font-size:16px;min-width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;
  padding:1px 5px;border-radius:10px;font-weight:600}
.sidebar-footer{border-top:1px solid var(--border);padding:6px 0}

/* ---- MAIN CONTENT ---- */
.main-content{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;
  height:100vh;overflow:hidden}

/* ---- TOP HEADER ---- */
.top-header{height:var(--header-h);background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;z-index:100}
.header-menu-btn{display:none;background:none;border:none;font-size:20px;cursor:pointer;
  color:var(--text2);padding:4px}
.header-title{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Lang Switcher */
.lang-switcher{display:flex;gap:2px;background:var(--bg);border-radius:20px;
  padding:2px;border:1px solid var(--border)}
.lang-tab{padding:3px 9px;border:none;background:none;border-radius:14px;
  cursor:pointer;font-size:11px;color:var(--text2);transition:all var(--trans);font-weight:500}
.lang-tab.active{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.lang-tab:hover:not(.active){background:var(--border)}

/* User Info */
.user-info{display:flex;align-items:center;gap:8px;cursor:pointer;
  padding:3px 8px;border-radius:20px;transition:background var(--trans)}
.user-info:hover{background:var(--bg)}
.user-avatar{width:30px;height:30px;background:var(--primary);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
.user-name{font-size:12px;font-weight:500}
.user-role{font-size:10px;color:var(--text2)}

/* ---- PAGE CONTENT ---- */
.page-content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ============================================================
   RFQ SPLIT PANEL
   ============================================================ */
.rfq-split{display:flex;height:100%;overflow:hidden}

/* LEFT PANEL */
.rfq-left{width:420px;min-width:280px;display:flex;flex-direction:column;
  border-right:1px solid var(--border);background:var(--card);flex-shrink:0}

.rfq-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--border)}
.rfq-toolbar .search-bar{flex:1;display:flex;align-items:center;gap:6px;
  background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:5px 12px}
.rfq-toolbar .search-bar input{border:none;outline:none;font-size:13px;
  background:transparent;flex:1;font-family:inherit;color:var(--text)}
.rfq-toolbar .search-bar .search-icon{color:var(--text2);font-size:14px}

/* Status tabs */
.rfq-status-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);
  background:var(--bg);flex-shrink:0}
.rfq-stab{padding:7px 12px;border:none;background:none;cursor:pointer;
  font-size:11px;font-weight:500;color:var(--text2);white-space:nowrap;
  border-bottom:2px solid transparent;font-family:inherit;
  transition:color var(--trans),border-color var(--trans)}
.rfq-stab:hover{color:var(--primary)}
.rfq-stab.active{color:var(--primary);border-bottom-color:var(--primary)}
.rfq-stab-count{display:inline-block;background:var(--border);color:var(--text2);
  font-size:10px;padding:1px 5px;border-radius:8px;margin-left:3px}
.rfq-stab.active .rfq-stab-count{background:var(--primary-light);color:var(--primary)}

/* RFQ list items */
.rfq-list-body{flex:1;overflow-y:auto}
.rfq-list-item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background var(--trans)}
.rfq-list-item:hover{background:var(--bg)}
.rfq-list-item.selected{background:var(--primary-light);border-left:3px solid var(--primary)}

.rfq-item-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.rfq-number{font-size:12px;font-weight:600;color:var(--primary);font-family:monospace}
.rfq-imported-badge{font-size:11px;title:"Imported"}
.rfq-item-customer{font-size:12px;font-weight:500;color:var(--text);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rfq-item-part{font-size:11px;color:var(--text2);margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rfq-item-bottom{display:flex;align-items:center;font-size:11px;color:var(--text2)}
.rfq-list-footer{padding:6px 14px;font-size:11px;color:var(--text2);
  background:var(--bg);border-top:1px solid var(--border);flex-shrink:0}

/* RESIZE DIVIDER */
.rfq-divider{width:4px;cursor:col-resize;background:var(--border);
  transition:background var(--trans);flex-shrink:0}
.rfq-divider:hover,.rfq-divider:active{background:var(--primary)}

/* RIGHT PANEL */
.rfq-right{flex:1;display:flex;flex-direction:column;min-width:320px;overflow:hidden;
  background:var(--card)}
.rfq-right-header{display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-bottom:1px solid var(--border);min-height:46px;flex-shrink:0}
#rfqRightTitle{font-size:14px;font-weight:600;flex:1;color:var(--text)}
.rfq-right-actions{display:flex;gap:6px;flex-shrink:0}
.rfq-right-body{flex:1;overflow-y:auto}

/* Import panel */
.rfq-import-body{padding:16px}
.rfq-import-info{background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:12px;margin-bottom:14px}
.rfq-import-info-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.rfq-import-info-row span{color:var(--text2)}
.rfq-import-info-row strong{color:var(--text)}
.rfq-section-title{font-size:12px;font-weight:600;color:var(--text);
  margin-bottom:8px;display:flex;align-items:center;gap:6px}

/* Column mapping grid */
.rfq-mapping-section{margin-bottom:14px}
.rfq-mapping-grid{display:grid;gap:2px;max-height:180px;overflow-y:auto;
  border:1px solid var(--border);border-radius:6px;background:var(--bg)}
.rfq-mapping-row{display:grid;grid-template-columns:1fr 20px 1fr;gap:4px;
  padding:4px 8px;font-size:11px;align-items:center}
.rfq-mapping-row.mapped{background:#fff}
.rfq-mapping-source{color:var(--text2);truncate:true;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rfq-mapping-arrow{text-align:center;color:var(--green);font-weight:700}
.rfq-mapping-target{color:var(--green);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Preview table */
.rfq-preview-table-wrap{overflow:auto;max-height:280px;border:1px solid var(--border);
  border-radius:6px;margin-bottom:14px}
.rfq-preview-table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
.rfq-preview-table th{background:var(--bg);padding:6px 10px;text-align:left;
  font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);
  position:sticky;top:0}
.rfq-preview-table td{padding:5px 10px;border-bottom:1px solid var(--border);max-width:160px;
  overflow:hidden;text-overflow:ellipsis}
.rfq-preview-table tr:hover td{background:var(--bg)}
.rfq-mapped-cell{background:rgba(52,168,83,.06);color:var(--green)}

/* RFQ Detail */
.rfq-detail{padding:16px}
.rfq-detail-status{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.badge-lg{font-size:13px;padding:5px 14px}
.rfq-imported-badge-lg{font-size:12px;color:var(--text2);background:var(--bg);
  padding:3px 8px;border-radius:12px;border:1px solid var(--border)}
.rfq-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.rfq-detail-row{background:var(--bg);border-radius:6px;padding:8px 10px}
.rfq-detail-label{font-size:10px;color:var(--text2);font-weight:500;margin-bottom:2px}
.rfq-detail-value{font-size:13px;color:var(--text);font-weight:500;
  word-break:break-word}
.rfq-detail-notes{background:var(--bg);border-radius:6px;padding:10px;margin-bottom:14px}
.rfq-detail-note-text{font-size:12px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.rfq-detail-meta{font-size:11px;color:var(--text2);margin-top:12px;
  padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px}

/* Stage progress */
.rfq-stage-progress{display:flex;align-items:center;margin-bottom:16px;
  background:var(--bg);border-radius:8px;padding:12px 16px;overflow-x:auto}
.rfq-stage-step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:60px}
.rfq-stage-dot{width:14px;height:14px;border-radius:50%;background:var(--border);
  border:2px solid var(--border);transition:all var(--trans)}
.rfq-stage-step.done .rfq-stage-dot{background:var(--primary);border-color:var(--primary)}
.rfq-stage-step.current .rfq-stage-dot{background:#fff;border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-light);width:16px;height:16px}
.rfq-stage-label{font-size:10px;color:var(--text2);text-align:center;white-space:nowrap}
.rfq-stage-step.done .rfq-stage-label,.rfq-stage-step.current .rfq-stage-label{color:var(--primary);font-weight:600}
.rfq-stage-line{flex:1;height:2px;background:var(--border);margin-bottom:18px;min-width:20px}

/* RFQ Form */
.rfq-form{padding:16px}

/* ---- STANDARD PAGES (non-split) ---- */
.std-page{padding:20px;max-width:100%;overflow-y:auto;height:100%}
.page-header{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-header h2{font-size:18px;font-weight:600}

/* KPI Grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;margin-bottom:18px}
.kpi-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi-label{font-size:11px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.kpi-value{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.kpi-sub{font-size:11px;color:var(--text2)}
.kpi-icon{font-size:28px;margin-bottom:2px}
.kpi-card.blue{border-top:3px solid var(--primary)}
.kpi-card.green{border-top:3px solid var(--green)}
.kpi-card.yellow{border-top:3px solid var(--yellow)}
.kpi-card.red{border-top:3px solid var(--red)}

/* Card */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Progress */
.progress-bar{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .6s ease}
.progress-fill.green{background:var(--green)}
.progress-fill.yellow{background:var(--yellow)}
.progress-fill.red{background:var(--red)}

/* Table */
.table-container{overflow-x:auto;border-radius:var(--radius);
  box-shadow:var(--shadow);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--bg);padding:9px 12px;text-align:left;
  font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.table-actions{display:flex;gap:5px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;
  border:none;cursor:pointer;font-size:12px;font-weight:500;
  transition:all var(--trans);white-space:nowrap;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--border)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover:not(:disabled){background:#a01915}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover:not(:disabled){background:#0d5c2b}
.btn-sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.6;cursor:not-allowed}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-blue{background:var(--primary-light);color:var(--primary)}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-yellow{background:var(--yellow-light);color:var(--yellow)}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-purple{background:var(--purple-light);color:var(--purple)}
.badge-gray{background:var(--bg);color:var(--text2)}

/* Forms */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;margin-bottom:5px;color:var(--text)}
.required{color:var(--red);margin-left:2px}
.form-control{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;
  font-size:13px;color:var(--text);background:#fff;transition:border-color var(--trans);font-family:inherit}
.form-control:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(26,115,232,.12)}
.form-control::placeholder{color:#bbb}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.filters-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search-bar{display:flex;align-items:center;gap:6px;background:#fff;
  border:1px solid var(--border);border-radius:20px;padding:5px 12px}
.search-bar input{border:none;outline:none;font-size:13px;flex:1;font-family:inherit;color:var(--text)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity var(--trans)}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:12px;box-shadow:var(--shadow-md);width:100%;
  max-width:540px;max-height:90vh;display:flex;flex-direction:column;
  transform:translateY(20px);transition:transform var(--trans)}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;
  color:var(--text2);padding:3px;border-radius:50%;line-height:1}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px}

/* Toast */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;
  display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;
  font-size:12px;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;
  animation:slideInRight .3s ease;pointer-events:all;max-width:320px}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.warning{background:var(--yellow)}
@keyframes slideInRight{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Spinner */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:10px}

/* Pipeline stages widget */
.pipeline-stages{display:flex;gap:6px;flex-wrap:wrap}
.pipeline-stage{flex:1;min-width:70px;text-align:center;padding:10px 6px;
  background:var(--bg);border-radius:var(--radius);border:1px solid var(--border)}
.stage-count{font-size:22px;font-weight:700;color:var(--primary)}
.stage-label{font-size:10px;color:var(--text2);margin-top:2px}

/* ============================================================
   RESPONSIVE - Tablet (≤1024px)
   ============================================================ */
@media (max-width:1024px) {
  :root{--sidebar-w:200px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .dash-grid{grid-template-columns:1fr}
  .rfq-left{width:340px}
}

/* ============================================================
   RESPONSIVE - Mobile (≤768px)
   ============================================================ */
@media (max-width:768px) {
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-md)}
  .sidebar-overlay.open{display:block}
  .main-content{margin-left:0}
  .header-menu-btn{display:block}
  .user-name,.user-role{display:none}
  .page-content{padding:0}
  .std-page{padding:12px}
  .form-row{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:8px}

  /* Mobile RFQ: stack panels */
  .rfq-split{flex-direction:column}
  .rfq-left{width:100%;height:50%;min-width:auto;border-right:none;border-bottom:1px solid var(--border)}
  .rfq-right{height:50%}
  .rfq-divider{display:none}

  .modal{max-width:100%;border-radius:16px 16px 0 0;margin:auto 0 0 0}
  .modal-overlay{align-items:flex-end}
  .toast-container{bottom:12px;right:10px;left:10px}
  .rfq-detail-grid{grid-template-columns:1fr}
}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#bbb}

  </style>
</head>
<body>
<div class="app-wrapper" id="app">

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">K</div>
      <div>
        <div class="logo-text" data-i18n="appName">CRM System</div>
        <div class="logo-sub">Kunomura Co., Ltd.</div>
      </div>
    </div>

var currentLang = 'ja';

function t(key) {
  return (I18N[currentLang] && I18N[currentLang][key] !== undefined)
    ? I18N[currentLang][key]
    : (I18N['en'] && I18N['en'][key] !== undefined ? I18N['en'][key] : key);
}

function setLang(lang) {
  if (!I18N[lang]) return;
  currentLang = lang;
  try { localStorage.setItem('crm_lang', lang); } catch(e){}
  document.documentElement.lang = lang;
  applyTranslations();
}

function applyTranslations() {
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
    el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
  });
  document.querySelectorAll('.lang-tab').forEach(function(tab) {
    tab.classList.toggle('active', tab.dataset.lang === currentLang);
  });
  if (typeof renderCurrentPage === 'function') renderCurrentPage();
}

<script>

// ── MOCK BACKEND (replaces google.script.run) ────────────────────────────────
var _db = JSON.parse(JSON.stringify(PREVIEW_DATA)); // working copy

function _uuid() {
  return 'rfq_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
}

function mockGetRFQs(params) {
  var rows = _db.slice();
  if (params && params.status && params.status !== 'all') {
    rows = rows.filter(function(r){ return r.status === params.status; });
  }
  if (params && params.search) {
    var q = params.search.toLowerCase();
    rows = rows.filter(function(r){
      return (r.rfqNumber||'').toLowerCase().indexOf(q) !== -1 ||
             (r.customerName||'').toLowerCase().indexOf(q) !== -1 ||
             (r.partName||'').toLowerCase().indexOf(q) !== -1;
    });
  }
  return rows;
}

function mockSaveRFQ(data) {
  var idx = _db.findIndex(function(r){ return r.id === data.id; });
  if (idx !== -1) {
    _db[idx] = Object.assign({}, _db[idx], data, { updatedAt: new Date().toISOString() });
  } else {
    data.id = data.id || _uuid();
    data.rfqNumber = data.rfqNumber || ('RFQ-' + String(_db.length+1).padStart(3,'0'));
    data.createdAt = new Date().toISOString();
    data.source = 'manual';
    _db.push(data);
  }
}

function mockDeleteRFQ(id) {
  var idx = _db.findIndex(function(r){ return r.id === id; });
  if (idx !== -1) _db.splice(idx, 1);
}

function mockPreviewData() {
  var headers = ['ID','Date','Customer','Subcon','BU','FAC','Item','Color',
    'UnitPrice','UnitPriceUnit','GP%','GP','Consumption/month',
    'ConsumptionUnit','Potential%','1stPO_Month','Revenue/month','GP/month','Remark'];
  var preview = PREVIEW_DATA.slice(0,10).map(function(r){
    return [r.rfqNumber, r.requestDate, r.customerName, r.subcon||'',
      r.productType, r.factory, r.partName, r.partColor||'',
      r.unitPrice||'', r.unitPriceUnit||'', r.grossProfitPct||'', r.grossProfit||'',
      r.quantity, r.unit, String(r.probability)+'%', r.closedDate||'',
      r.revenuePerMonth||'', r.gpPerMonth||'', r.notes||''];
  });
  var mapping = {
    rfqNumber:0, requestDate:1, customerName:2, subcon:3,
    productType:4, factory:5, partName:6, partColor:7,
    unitPrice:8, grossProfitPct:10, grossProfit:11,
    quantity:12, consumptionUnit:13, probability:14,
    closedDate:15, revenuePerMonth:16, gpPerMonth:17, notes:18
  };
  return {
    success: true,
    sheetName: 'RFQ',
    headers: headers,
    preview: preview,
    totalRows: PREVIEW_DATA.length,
    mapping: mapping
  };
}

</script>

<script>

// ── APP SHELL ──────────────────────────────────────────────────────────────
var app = {
  user: { email:'admin@kunomura.com', name:'Admin', role:'admin', lang:'ja' },
  currentPage: 'rfq',
  data: {}
};

function initApp(userData) {
  app.user = userData || app.user;
  currentLang = localStorage.getItem('crm_lang') || 'ja';
  document.getElementById('userName').textContent = app.user.name;
  document.getElementById('userRole').textContent = t('roleAdmin');
  document.getElementById('userAvatar').textContent = (app.user.name||'A').charAt(0).toUpperCase();
  applyTranslations();
  navigate('rfq');
}

function navigate(page) {
  app.currentPage = page;
  closeSidebar();
  document.querySelectorAll('.nav-item').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.page === page);
  });
  document.getElementById('pageContent').innerHTML =
    '<div style="display:flex;align-items:center;justify-content:center;height:300px;gap:12px">' +
    '<div class="spinner"></div><span style="color:#5f6368">Loading...</span></div>';
  if (page === 'rfq') { renderRFQPage(); }
  else {
    document.getElementById('pageContent').innerHTML =
      '<div class="empty-state" style="padding:60px"><div class="empty-icon">🚧</div>' +
      '<p style="margin-top:12px">このページはプレビュー版では未実装です</p>' +
      '<p style="font-size:11px;color:#5f6368;margin-top:6px">Web App デプロイ版で利用可能です</p></div>';
    setHeaderTitle(t(page) || page);
  }
}

function renderCurrentPage() { navigate(app.currentPage); }

function setHeaderTitle(title) {
  document.getElementById('headerTitle').textContent = title;
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

function showConfirm(message, callback) {
  document.getElementById('confirmMessage').textContent = message;
  document.getElementById('confirmOkBtn').onclick = callback;
  document.getElementById('confirmModal').classList.add('open');
}
function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('open');
}
function closeModal(id) {
  var el = document.getElementById(id); if (el) el.classList.remove('open');
}

function showToast(message, type) {
  var toast = document.createElement('div');
  toast.className = 'toast ' + (type||'info');
  toast.textContent = message;
  document.getElementById('toastContainer').appendChild(toast);
  setTimeout(function(){ toast.remove(); }, 3000);
}

function generateId() {
  return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2,9);
}
function formatDate(dateStr) {
  if (!dateStr) return '-';
  var d = new Date(dateStr);
  if (isNaN(d)) return String(dateStr);
  return d.getFullYear() + '/' +
    String(d.getMonth()+1).padStart(2,'0') + '/' +
    String(d.getDate()).padStart(2,'0');
}
function capitalizeFirst(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

</script>

<script>

// ============================================================
// RFQ Module - Split-panel UI
// Left: RFQ list + filters
// Right: Import preview OR selected RFQ detail
// ============================================================

var rfqState = {
  list: [],
  filtered: [],
  selected: null,
  importPreview: null,
  rightMode: 'import', // 'import' | 'detail' | 'form'
  filterStatus: 'all',
  search: '',
  importMapping: {}
};

// ---- RENDER RFQ PAGE (split-panel) ----
function renderRFQPage() {
  setHeaderTitle(t('rfqTitle'));
  document.getElementById('pageContent').innerHTML = `
    <div id="rfqSplitPanel" class="rfq-split">
      <!-- LEFT PANEL -->
      <div class="rfq-left" id="rfqLeft">
        <div class="rfq-toolbar">
          <div class="search-bar" style="flex:1">
            <span class="search-icon">🔍</span>
            <input type="text" id="rfqSearchInput" placeholder="${t('search')}..."
              oninput="rfqSearch(this.value)">
          </div>
          <button class="btn btn-primary btn-sm" onclick="rfqShowForm()">
            ➕ ${t('addRFQ')}
          </button>
        </div>

        <!-- Status filter tabs -->
        <div class="rfq-status-tabs" id="rfqStatusTabs">
          ${['all','Open','Quoting','Submitted','Won','Lost'].map(function(s){
            return `<button class="rfq-stab ${s==='all'?'active':''}"
              data-status="${s}" onclick="rfqFilterStatus('${s}')">
              ${t('rfqStatus_'+s)||s}
              <span class="rfq-stab-count" id="rfqCount_${s}">0</span>
            </button>`;
          }).join('')}
        </div>

        <!-- List -->
        <div class="rfq-list-body" id="rfqListBody">
          <div style="text-align:center;padding:40px">
            <div class="spinner"></div>
          </div>
        </div>

        <!-- Footer count -->
        <div class="rfq-list-footer" id="rfqListFooter"></div>
      </div>

      <!-- RESIZE HANDLE -->
      <div class="rfq-divider" id="rfqDivider" title="ドラッグで幅調整"></div>

      <!-- RIGHT PANEL -->
      <div class="rfq-right" id="rfqRight">
        <div class="rfq-right-header" id="rfqRightHeader">
          <span id="rfqRightTitle">${t('importPreview')}</span>
          <div class="rfq-right-actions" id="rfqRightActions"></div>
        </div>
        <div class="rfq-right-body" id="rfqRightBody">
          <div style="text-align:center;padding:60px 24px;color:#5f6368">
            <div style="font-size:48px;margin-bottom:16px">📋</div>
            <p style="font-size:15px;font-weight:600;margin-bottom:8px">${t('importPreviewHint')}</p>
            <p style="font-size:13px;margin-bottom:24px">${t('importPreviewSub')}</p>
            <button class="btn btn-primary" onclick="rfqLoadImportPreview()">
              🔄 ${t('loadSourceData')}
            </button>
          </div>
        </div>
      </div>
    </div>
  `;

  initRFQResize();
  loadRFQList();
}

// ---- LOAD RFQ LIST ----
function loadRFQList() {
  var rows = mockGetRFQs({});
  rfqState.list = rows;
  rfqApplyFilter();
}

// ---- FILTER & RENDER LIST ----
function rfqSearch(val) {
  rfqState.search = val;
  rfqApplyFilter();
}

function rfqFilterStatus(status) {
  rfqState.filterStatus = status;
  document.querySelectorAll('.rfq-stab').forEach(function(b) {
    b.classList.toggle('active', b.dataset.status === status);
  });
  rfqApplyFilter();
}

function rfqApplyFilter() {
  var rows = rfqState.list;
  var q = rfqState.search.toLowerCase();

  if (rfqState.filterStatus !== 'all') {
    rows = rows.filter(function(r) { return r.status === rfqState.filterStatus; });
  }
  if (q) {
    rows = rows.filter(function(r) {
      return (r.rfqNumber||'').toLowerCase().indexOf(q) !== -1 ||
             (r.customerName||'').toLowerCase().indexOf(q) !== -1 ||
             (r.partName||'').toLowerCase().indexOf(q) !== -1 ||
             (r.partNumber||'').toLowerCase().indexOf(q) !== -1;
    });
  }
  rfqState.filtered = rows;
  rfqRenderList(rows);
  rfqUpdateStatusCounts();
}

function rfqUpdateStatusCounts() {
  var all = rfqState.list;
  ['all','Open','Quoting','Submitted','Won','Lost'].forEach(function(s) {
    var el = document.getElementById('rfqCount_'+s);
    if (!el) return;
    if (s === 'all') { el.textContent = all.length; return; }
    el.textContent = all.filter(function(r){ return r.status === s; }).length;
  });
}

function rfqRenderList(rows) {
  var el = document.getElementById('rfqListBody');
  var footer = document.getElementById('rfqListFooter');
  if (!el) return;

  if (!rows || rows.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📋</div>
      <p>${t('noData')}</p>
    </div>`;
    footer.textContent = '';
    return;
  }

  el.innerHTML = rows.map(function(r) {
    var sc = rfqStatusColor(r.status);
    var isSelected = rfqState.selected && rfqState.selected.id === r.id;
    var amount = r.quotedAmount ? formatCurrency(r.quotedAmount, r.currency) : '-';
    var imported = r.source === 'imported'
      ? '<span class="rfq-imported-badge">📥</span>' : '';

    return `<div class="rfq-list-item ${isSelected?'selected':''}"
        onclick="rfqSelectRow('${r.id}')">
      <div class="rfq-item-top">
        <span class="rfq-number">${r.rfqNumber||'-'}</span>
        ${imported}
        <span class="badge badge-${sc}" style="margin-left:auto">${t('rfqStatus_'+r.status)||r.status}</span>
      </div>
      <div class="rfq-item-customer">🏢 ${r.customerName||'-'}</div>
      <div class="rfq-item-part">⚙️ ${r.partName||'-'}${r.partNumber?' ('+r.partNumber+')':''}</div>
      <div class="rfq-item-bottom">
        <span>📅 ${formatDate(r.requestDate)}</span>
        <span style="margin-left:auto;font-weight:600">${amount}</span>
      </div>
    </div>`;
  }).join('');

  footer.textContent = rows.length + ' ' + t('records');
}

function rfqStatusColor(status) {
  var map = {
    'Open':'blue', 'Quoting':'yellow', 'Submitted':'purple',
    'Won':'green', 'Lost':'red', 'On Hold':'gray', 'Cancelled':'gray'
  };
  return map[status] || 'gray';
}

// ---- SELECT ROW → show detail on right ----
function rfqSelectRow(id) {
  var row = rfqState.list.find(function(r){ return r.id === id; });
  if (!row) return;
  rfqState.selected = row;
  rfqState.rightMode = 'detail';

  // highlight selection
  document.querySelectorAll('.rfq-list-item').forEach(function(el) {
    el.classList.toggle('selected', el.onclick && el.onclick.toString().indexOf(id) !== -1);
  });
  document.querySelectorAll('.rfq-list-item').forEach(function(el) {
    el.classList.remove('selected');
  });
  var items = document.querySelectorAll('.rfq-list-item');
  items.forEach(function(el) {
    if (el.getAttribute('onclick') && el.getAttribute('onclick').indexOf(id) !== -1) {
      el.classList.add('selected');
    }
  });

  rfqRenderDetail(row);
}

// ---- DETAIL PANEL ----
function rfqRenderDetail(r) {
  document.getElementById('rfqRightTitle').textContent = r.rfqNumber || t('rfqDetail');

  document.getElementById('rfqRightActions').innerHTML = `
    <button class="btn btn-sm btn-secondary" onclick="rfqShowForm('${r.id}')">✏️ ${t('edit')}</button>
    <button class="btn btn-sm btn-danger" onclick="rfqConfirmDelete('${r.id}')">🗑️</button>
  `;

  var sc = rfqStatusColor(r.status);
  document.getElementById('rfqRightBody').innerHTML = `
    <div class="rfq-detail">

      <!-- Status bar -->
      <div class="rfq-detail-status">
        <span class="badge badge-${sc} badge-lg">${t('rfqStatus_'+r.status)||r.status}</span>
        ${r.source === 'imported' ? '<span class="rfq-imported-badge-lg">📥 インポート済み</span>' : ''}
      </div>

      <!-- Grid of fields -->
      <div class="rfq-detail-grid">
        ${rfqDetailRow('🏢', t('customerName'), r.customerName)}
        ${rfqDetailRow('🔢', t('rfqNumber'), r.rfqNumber)}
        ${rfqDetailRow('⚙️', t('partName'), r.partName)}
        ${rfqDetailRow('🏷️', t('partNumber'), r.partNumber)}
        ${rfqDetailRow('📦', t('quantity'), (r.quantity||'-') + ' ' + (r.unit||''))}
        ${rfqDetailRow('📅', t('requestDate'), formatDate(r.requestDate))}
        ${rfqDetailRow('⏰', t('dueDate'), formatDate(r.dueDate))}
        ${rfqDetailRow('📝', t('quotedDate'), formatDate(r.quotedDate))}
        ${rfqDetailRow('💰', t('quotedAmount'), r.quotedAmount ? formatCurrency(r.quotedAmount, r.currency) : '-')}
        ${rfqDetailRow('👤', t('assignedTo'), r.assignedTo)}
      </div>

      ${r.notes ? `<div class="rfq-detail-notes">
        <div class="rfq-detail-label">📋 ${t('notes')}</div>
        <div class="rfq-detail-note-text">${r.notes}</div>
      </div>` : ''}

      <!-- Stage progress bar -->
      <div class="rfq-stage-progress">
        ${['Open','Quoting','Submitted','Won'].map(function(s, i) {
          var stages = ['Open','Quoting','Submitted','Won','Lost'];
          var curIdx = stages.indexOf(r.status);
          var done = i <= curIdx && r.status !== 'Lost';
          return `<div class="rfq-stage-step ${done?'done':''} ${r.status===s?'current':''}">
            <div class="rfq-stage-dot"></div>
            <div class="rfq-stage-label">${t('rfqStatus_'+s)||s}</div>
          </div>`;
        }).join('<div class="rfq-stage-line"></div>')}
      </div>

      <div class="rfq-detail-meta">
        <span>作成: ${formatDate(r.createdAt)} by ${r.createdBy||'-'}</span>
        ${r.updatedAt ? `<span>更新: ${formatDate(r.updatedAt)}</span>` : ''}
      </div>
    </div>
  `;
}

function rfqDetailRow(icon, label, value) {
  return `<div class="rfq-detail-row">
    <div class="rfq-detail-label">${icon} ${label}</div>
    <div class="rfq-detail-value">${value || '-'}</div>
  </div>`;
}

// ---- IMPORT PREVIEW (右側パネル) ----
function rfqLoadImportPreview() {
  document.getElementById('rfqRightTitle').textContent = t('importPreview');
  document.getElementById('rfqRightActions').innerHTML =
    `<span style="font-size:12px;color:#5f6368">${t('loadingSource')}</span>`;
  document.getElementById('rfqRightBody').innerHTML =
    `<div style="text-align:center;padding:40px"><div class="spinner"></div>
    <p style="margin-top:12px;color:#5f6368">${t('readingSource')}</p></div>`;

  var result = mockPreviewData();
  rfqState.importPreview = result;
  rfqState.importMapping = result.mapping || {};
  rfqRenderImportPreview(result);
}

function rfqShowImportError(msg) {
  document.getElementById('rfqRightTitle').textContent = t('importError');
  document.getElementById('rfqRightActions').innerHTML = '';
  document.getElementById('rfqRightBody').innerHTML = `
    <div style="padding:24px">
      <div style="background:#fce8e6;border-left:4px solid #ea4335;padding:16px;border-radius:8px">
        <p style="color:#c5221f;font-weight:600">❌ ${t('importError')}</p>
        <p style="font-size:12px;color:#5f6368;margin-top:8px">${msg}</p>
        <p style="font-size:12px;margin-top:12px">${t('importErrorHint')}</p>
      </div>
      <button class="btn btn-secondary" style="margin-top:16px" onclick="rfqLoadImportPreview()">
        🔄 ${t('retry')}
      </button>
    </div>`;
}

function rfqRenderImportPreview(result) {
  document.getElementById('rfqRightTitle').textContent =
    `📥 ${t('importPreview')} (${result.totalRows} ${t('records')})`;

  document.getElementById('rfqRightActions').innerHTML = `
    <button class="btn btn-success btn-sm" onclick="rfqExecuteImport()">
      ✅ ${t('importAll')} (${result.totalRows}件)
    </button>
  `;

  var headers = result.headers || [];
  var preview = result.preview || [];
  var mapping = result.mapping || {};

  // Reverse mapping: colIndex → fieldName
  var colToField = {};
  Object.keys(mapping).forEach(function(f) {
    if (mapping[f] !== undefined) colToField[mapping[f]] = f;
  });

  document.getElementById('rfqRightBody').innerHTML = `
    <div class="rfq-import-body">
      <!-- Source info -->
      <div class="rfq-import-info">
        <div class="rfq-import-info-row">
          <span>📊 ${t('sourceSheet')}:</span>
          <strong>${result.sheetName}</strong>
        </div>
        <div class="rfq-import-info-row">
          <span>📋 ${t('totalRecords')}:</span>
          <strong>${result.totalRows} ${t('records')}</strong>
        </div>
        <div class="rfq-import-info-row">
          <span>🗂️ ${t('columns')}:</span>
          <strong>${headers.length}</strong>
        </div>
        <div class="rfq-import-info-row">
          <span>🔗 ${t('autoMapped')}:</span>
          <strong>${Object.keys(mapping).length} ${t('fields')}</strong>
        </div>
      </div>

      <!-- Column mapping display -->
      <div class="rfq-mapping-section">
        <div class="rfq-section-title">🔗 ${t('columnMapping')}</div>
        <div class="rfq-mapping-grid">
          ${headers.map(function(h, i) {
            var field = colToField[i] || '';
            var mapped = field ? true : false;
            return `<div class="rfq-mapping-row ${mapped?'mapped':''}">
              <div class="rfq-mapping-source">${h}</div>
              <div class="rfq-mapping-arrow">${mapped?'→':'·'}</div>
              <div class="rfq-mapping-target">${mapped ? t(field)||field : '-'}</div>
            </div>`;
          }).join('')}
        </div>
      </div>

      <!-- Preview table -->
      <div class="rfq-section-title" style="margin-top:16px">
        👁️ ${t('previewData')} (${t('first10rows')})
      </div>
      <div class="rfq-preview-table-wrap">
        <table class="rfq-preview-table">
          <thead>
            <tr>
              <th>#</th>
              ${headers.map(function(h,i) {
                var field = colToField[i];
                return `<th title="${field?t(field)||field:''}">
                  ${h}${field?'<br><small style="color:#34a853">→'+t(field)+'</small>':''}
                </th>`;
              }).join('')}
            </tr>
          </thead>
          <tbody>
            ${preview.map(function(row, ri) {
              return `<tr>
                <td style="color:#5f6368;font-size:11px">${ri+1}</td>
                ${row.map(function(cell, ci) {
                  var mapped = colToField[ci];
                  return `<td class="${mapped?'rfq-mapped-cell':''}">${cell||''}</td>`;
                }).join('')}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>

      <!-- Import button at bottom -->
      <div style="padding:16px;text-align:center;border-top:1px solid #dadce0">
        <button class="btn btn-primary" onclick="rfqExecuteImport()">
          ✅ ${t('importAll')} (${result.totalRows}件をインポート)
        </button>
        <p style="font-size:11px;color:#5f6368;margin-top:8px">${t('importNote')}</p>
      </div>
    </div>
  `;
}

// ---- EXECUTE IMPORT ----
function rfqExecuteImport() {
  if (!confirm(t('confirmImport') + '\n\n' + rfqState.importPreview.totalRows + t('confirmImportRows'))) return;

  document.getElementById('rfqRightActions').innerHTML =
    `<div class="spinner" style="width:16px;height:16px"></div>
     <span style="font-size:12px;color:#5f6368;margin-left:8px">${t('importing')}</span>`;

  showToast('✅ データは既にロード済みです (130件)', 'success');
  loadRFQList();
}

// ---- ADD / EDIT FORM ----
function rfqShowForm(id) {
  var row = id ? rfqState.list.find(function(r){ return r.id === id; }) : {};
  rfqState.rightMode = 'form';

  document.getElementById('rfqRightTitle').textContent = id ? t('editRFQ') : t('addRFQ');
  document.getElementById('rfqRightActions').innerHTML = `
    <button class="btn btn-sm btn-secondary" onclick="rfqCancelForm()">✕ ${t('cancel')}</button>
    <button class="btn btn-sm btn-primary" onclick="rfqSubmitForm()">💾 ${t('save')}</button>
  `;

  document.getElementById('rfqRightBody').innerHTML = `
    <div class="rfq-form" id="rfqFormBody">
      <input type="hidden" id="rfqFormId" value="${row.id||''}">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">${t('rfqNumber')}</label>
          <input class="form-control" id="rfqF_rfqNumber" value="${row.rfqNumber||''}"
            placeholder="RFQ-202504-001">
        </div>
        <div class="form-group">
          <label class="form-label">${t('status')}</label>
          <select class="form-control" id="rfqF_status">
            ${['Open','Quoting','Submitted','Won','Lost','On Hold','Cancelled'].map(function(s){
              return `<option value="${s}" ${(row.status||'Open')===s?'selected':''}>${t('rfqStatus_'+s)||s}</option>`;
            }).join('')}
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">${t('customerName')} <span class="required">*</span></label>
        <input class="form-control" id="rfqF_customerName" value="${row.customerName||''}"
          placeholder="${t('customerName')}">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">${t('partName')}</label>
          <input class="form-control" id="rfqF_partName" value="${row.partName||''}"
            placeholder="${t('partName')}">
        </div>
        <div class="form-group">
          <label class="form-label">${t('partNumber')}</label>
          <input class="form-control" id="rfqF_partNumber" value="${row.partNumber||''}"
            placeholder="${t('partNumber')}">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">${t('quantity')}</label>
          <input class="form-control" type="number" id="rfqF_quantity" value="${row.quantity||''}"
            placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">${t('unit')}</label>
          <select class="form-control" id="rfqF_unit">
            ${['pcs','kg','m','m²','m³','set','lot','box'].map(function(u){
              return `<option value="${u}" ${(row.unit||'pcs')===u?'selected':''}>${u}</option>`;
            }).join('')}
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">${t('requestDate')}</label>
          <input class="form-control" type="date" id="rfqF_requestDate"
            value="${row.requestDate||''}">
        </div>
        <div class="form-group">
          <label class="form-label">${t('dueDate')}</label>
          <input class="form-control" type="date" id="rfqF_dueDate"
            value="${row.dueDate||''}">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">${t('quotedAmount')}</label>
          <input class="form-control" type="number" id="rfqF_quotedAmount"
            value="${row.quotedAmount||''}" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">${t('currency')}</label>
          <select class="form-control" id="rfqF_currency">
            ${['THB','JPY','USD','EUR','CNY'].map(function(c){
              return `<option value="${c}" ${(row.currency||'THB')===c?'selected':''}>${c}</option>`;
            }).join('')}
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">${t('quotedDate')}</label>
        <input class="form-control" type="date" id="rfqF_quotedDate"
          value="${row.quotedDate||''}">
      </div>

      <div class="form-group">
        <label class="form-label">${t('assignedTo')}</label>
        <input class="form-control" id="rfqF_assignedTo" value="${row.assignedTo||app.user.email}"
          placeholder="${t('assignedTo')}">
      </div>

      <div class="form-group">
        <label class="form-label">${t('notes')}</label>
        <textarea class="form-control" id="rfqF_notes" rows="3"
          placeholder="${t('notes')}">${row.notes||''}</textarea>
      </div>
    </div>
  `;
}

function rfqCancelForm() {
  if (rfqState.selected) {
    rfqRenderDetail(rfqState.selected);
  } else {
    rfqLoadImportPreview();
  }
}

function rfqSubmitForm() {
  var id = document.getElementById('rfqFormId').value;
  function fv(fid) {
    var el = document.getElementById('rfqF_'+fid);
    return el ? el.value.trim() : '';
  }

  var customerName = fv('customerName');
  if (!customerName) { showToast(t('customerRequired'), 'error'); return; }

  var data = {
    id: id || null,
    rfqNumber: fv('rfqNumber'),
    customerName: customerName,
    partName: fv('partName'),
    partNumber: fv('partNumber'),
    quantity: fv('quantity'),
    unit: fv('unit'),
    requestDate: fv('requestDate'),
    dueDate: fv('dueDate'),
    quotedDate: fv('quotedDate'),
    quotedAmount: fv('quotedAmount'),
    currency: fv('currency'),
    status: fv('status'),
    assignedTo: fv('assignedTo'),
    notes: fv('notes')
  };

  // Disable save button
  var saveBtn = document.querySelector('[onclick="rfqSubmitForm()"]');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '⏳ ' + t('saving'); }

  mockSaveRFQ(data);
  showToast(t('saveSuccess'), 'success');
  loadRFQList();
  setTimeout(function() {
    var updated = rfqState.list.find(function(r){ return r.rfqNumber === data.rfqNumber; });
    if (updated) rfqSelectRow(updated.id);
  }, 200);
}

// ---- DELETE ----
function rfqConfirmDelete(id) {
  showConfirm(t('confirmDelete'), function() {
    closeConfirm();
    mockDeleteRFQ(id);
    showToast(t('deleteSuccess'), 'success');
    rfqState.selected = null;
    document.getElementById('rfqRightTitle').textContent = t('importPreview');
    document.getElementById('rfqRightActions').innerHTML = '';
    document.getElementById('rfqRightBody').innerHTML = '<div style="text-align:center;padding:60px 20px;color:#5f6368"><div style="font-size:48px">📋</div><p style="margin-top:12px">' + t('importPreviewHint') + '</p></div>';
    loadRFQList();
  });
}

// ---- RESIZE HANDLE (drag to resize panels) ----
function initRFQResize() {
  var divider = document.getElementById('rfqDivider');
  var left = document.getElementById('rfqLeft');
  var right = document.getElementById('rfqRight');
  if (!divider || !left || !right) return;

  var dragging = false;
  var startX, startLeftW;

  divider.addEventListener('mousedown', function(e) {
    dragging = true;
    startX = e.clientX;
    startLeftW = left.offsetWidth;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    var dx = e.clientX - startX;
    var total = left.parentElement.offsetWidth;
    var newW = Math.max(280, Math.min(startLeftW + dx, total - 320));
    left.style.width = newW + 'px';
    left.style.flex = 'none';
  });

  document.addEventListener('mouseup', function() {
    if (dragging) {
      dragging = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });
}

// ---- CURRENCY FORMAT ----
function formatCurrency(amount, currency) {
  var num = parseFloat(amount) || 0;
  var cur = currency || 'THB';
  var symbols = { 'JPY':'¥', 'THB':'฿', 'USD':'$', 'EUR':'€', 'CNY':'¥' };
  var sym = symbols[cur] || '';
  return sym + num.toLocaleString('ja-JP', {maximumFractionDigits: 0}) + ' ' + cur;
}
