<style>
/* ============================================================
   CRM System - Responsive Stylesheet
   Mobile-first, works on PC / Tablet / Phone
   ============================================================ */

/* -- Reset & Base -- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --primary-light: #e8f0fe;
  --secondary: #34a853;
  --warning: #fbbc04;
  --danger: #ea4335;
  --text: #202124;
  --text-secondary: #5f6368;
  --border: #dadce0;
  --bg: #f8f9fa;
  --card-bg: #ffffff;
  --sidebar-width: 240px;
  --header-h: 60px;
  --shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
  --radius: 8px;
  --transition: 0.2s ease;
}

html, body {
  height: 100%;
  font-family: 'Google Sans', 'Noto Sans Thai', 'Noto Sans JP', Arial, sans-serif;
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
}

/* -- Layout -- */
.app-wrapper {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* -- Sidebar -- */
.sidebar {
  width: var(--sidebar-width);
  height: 100vh;
  background: var(--card-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  left: 0; top: 0;
  z-index: 200;
  transition: transform var(--transition);
  overflow-y: auto;
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px;
  border-bottom: 1px solid var(--border);
  min-height: var(--header-h);
}

.sidebar-logo .logo-icon {
  width: 32px; height: 32px;
  background: var(--primary);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: bold; font-size: 16px;
}

.sidebar-logo .logo-text {
  font-size: 15px; font-weight: 600; color: var(--text);
}

.sidebar-nav {
  flex: 1;
  padding: 8px 0;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 0 24px 24px 0;
  margin-right: 12px;
  color: var(--text-secondary);
  transition: background var(--transition), color var(--transition);
  font-size: 14px;
  border: none; background: none; width: 100%; text-align: left;
}

.nav-item:hover { background: var(--bg); color: var(--primary); }
.nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
.nav-item .nav-icon { font-size: 18px; min-width: 24px; text-align: center; }
.nav-item .nav-badge {
  margin-left: auto;
  background: var(--danger);
  color: white;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 10px;
  font-weight: 600;
}

.sidebar-footer {
  border-top: 1px solid var(--border);
  padding: 8px 0;
}

/* -- Main Content -- */
.main-content {
  flex: 1;
  margin-left: var(--sidebar-width);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* -- Top Header -- */
.top-header {
  height: var(--header-h);
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  position: sticky;
  top: 0; z-index: 100;
  flex-shrink: 0;
}

.header-menu-btn {
  display: none;
  background: none; border: none;
  font-size: 22px; cursor: pointer;
  color: var(--text-secondary);
  padding: 4px;
}

.header-title {
  font-size: 18px; font-weight: 600;
  flex: 1;
}

/* Language Switcher */
.lang-switcher {
  display: flex;
  gap: 2px;
  background: var(--bg);
  border-radius: 20px;
  padding: 3px;
  border: 1px solid var(--border);
}

.lang-tab {
  padding: 4px 10px;
  border: none; background: none;
  border-radius: 16px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-secondary);
  transition: all var(--transition);
  font-weight: 500;
}
.lang-tab.active {
  background: var(--primary);
  color: white;
  box-shadow: var(--shadow);
}
.lang-tab:hover:not(.active) { background: var(--border); }

/* User Info */
.user-info {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; padding: 4px 8px;
  border-radius: 20px;
  transition: background var(--transition);
}
.user-info:hover { background: var(--bg); }
.user-avatar {
  width: 32px; height: 32px;
  background: var(--primary);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 600; font-size: 13px;
}
.user-name { font-size: 13px; font-weight: 500; }
.user-role { font-size: 11px; color: var(--text-secondary); }

/* -- Page Content -- */
.page-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

/* -- Page Header -- */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.page-header h2 {
  font-size: 20px; font-weight: 600;
}

/* -- Cards -- */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 16px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}

/* -- KPI / Stat Cards -- */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.kpi-card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.kpi-label {
  font-size: 12px;
  color: var(--text-secondary);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.kpi-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
}

.kpi-sub {
  font-size: 12px;
  color: var(--text-secondary);
}

.kpi-icon {
  font-size: 32px;
  margin-bottom: 4px;
}

.kpi-card.blue { border-top: 3px solid var(--primary); }
.kpi-card.green { border-top: 3px solid var(--secondary); }
.kpi-card.yellow { border-top: 3px solid var(--warning); }
.kpi-card.red { border-top: 3px solid var(--danger); }

/* -- Buttons -- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all var(--transition);
  white-space: nowrap;
  font-family: inherit;
}

.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #c5221f; }
.btn-success { background: var(--secondary); color: white; }
.btn-success:hover { background: #2d8e46; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 6px; border-radius: 50%; }

/* -- Forms -- */
.form-group { margin-bottom: 16px; }

.form-label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 6px;
  color: var(--text);
}

.form-label .required { color: var(--danger); margin-left: 2px; }

.form-control {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  color: var(--text);
  background: white;
  transition: border-color var(--transition);
  font-family: inherit;
}

.form-control:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26,115,232,0.15);
}

.form-control::placeholder { color: #bbb; }

select.form-control { cursor: pointer; }
textarea.form-control { resize: vertical; min-height: 80px; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

/* -- Search Bar -- */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 6px 14px;
  flex: 1;
  max-width: 320px;
}

.search-bar input {
  border: none; outline: none;
  font-size: 14px; flex: 1;
  font-family: inherit;
  color: var(--text);
}

.search-bar .search-icon { color: var(--text-secondary); }

/* -- Table -- */
.table-container {
  overflow-x: auto;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  background: white;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead th {
  background: var(--bg);
  padding: 11px 14px;
  text-align: left;
  font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}

tbody td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg); }

.table-actions { display: flex; gap: 6px; }

/* -- Badges / Chips -- */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.badge-blue { background: #e8f0fe; color: var(--primary); }
.badge-green { background: #e6f4ea; color: #137333; }
.badge-yellow { background: #fef9e7; color: #8d5b00; }
.badge-red { background: #fce8e6; color: #c5221f; }
.badge-gray { background: var(--bg); color: var(--text-secondary); }
.badge-purple { background: #f3e8fd; color: #6f3fbd; }

/* -- Modal -- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--transition);
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: all;
}

.modal {
  background: white;
  border-radius: 12px;
  box-shadow: var(--shadow-md);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  transform: translateY(20px);
  transition: transform var(--transition);
}

.modal-overlay.open .modal { transform: translateY(0); }

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--border);
}

.modal-title { font-size: 17px; font-weight: 600; }

.modal-close {
  background: none; border: none;
  font-size: 20px; cursor: pointer;
  color: var(--text-secondary);
  padding: 4px; border-radius: 50%;
  line-height: 1;
}
.modal-close:hover { background: var(--bg); }

.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
.modal-footer {
  padding: 14px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* -- Toast Notifications -- */
.toast-container {
  position: fixed;
  bottom: 24px; right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  background: var(--text);
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
  font-size: 13px;
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 8px;
  animation: slideInRight 0.3s ease;
  pointer-events: all;
}

.toast.success { background: #137333; }
.toast.error { background: var(--danger); }
.toast.warning { background: #8d5b00; }

@keyframes slideInRight {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* -- Charts -- */
.chart-wrapper {
  position: relative;
  height: 260px;
}

/* -- Progress Bar -- */
.progress-bar {
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 4px;
  transition: width 0.6s ease;
}

.progress-fill.green { background: var(--secondary); }
.progress-fill.yellow { background: var(--warning); }
.progress-fill.red { background: var(--danger); }

/* -- Tabs -- */
.tab-list {
  display: flex;
  border-bottom: 2px solid var(--border);
  margin-bottom: 20px;
  gap: 0;
  overflow-x: auto;
}

.tab-btn {
  padding: 10px 18px;
  border: none; background: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  white-space: nowrap;
  font-family: inherit;
  transition: color var(--transition), border-color var(--transition);
}

.tab-btn:hover { color: var(--primary); }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

/* -- Empty State -- */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-secondary);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; }

/* -- Loading Spinner -- */
.spinner {
  display: inline-block;
  width: 20px; height: 20px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(255,255,255,0.8);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 12px;
}

/* -- Confirm Dialog -- */
.confirm-dialog {
  max-width: 400px;
}

/* -- Sidebar overlay for mobile -- */
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 199;
}

/* -- Filters Bar -- */
.filters-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 16px;
}

/* -- Dashboard 2-col grid -- */
.dash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

/* -- Stage pipeline visual -- */
.pipeline-stages {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.pipeline-stage {
  flex: 1;
  min-width: 80px;
  text-align: center;
  padding: 12px 8px;
  background: var(--bg);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

.pipeline-stage .stage-count {
  font-size: 24px; font-weight: 700; color: var(--primary);
}

.pipeline-stage .stage-label {
  font-size: 11px; color: var(--text-secondary); margin-top: 2px;
}

/* -- RFQ status colors -- */
.stage-won { color: var(--secondary); font-weight: 600; }
.stage-lost { color: var(--danger); font-weight: 600; }
.stage-negotiation { color: var(--primary); font-weight: 600; }

/* -- Detail panel -- */
.detail-tabs {
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

/* ============================================================
   RESPONSIVE - Tablet (≤1024px)
   ============================================================ */
@media (max-width: 1024px) {
  :root { --sidebar-width: 200px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .dash-grid { grid-template-columns: 1fr; }
}

/* ============================================================
   RESPONSIVE - Mobile (≤768px)
   ============================================================ */
@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%);
  }

  .sidebar.open {
    transform: translateX(0);
    box-shadow: var(--shadow-md);
  }

  .sidebar-overlay.open { display: block; }

  .main-content { margin-left: 0; }

  .header-menu-btn { display: block; }

  .user-name, .user-role { display: none; }

  .page-content { padding: 12px; }

  .form-row { grid-template-columns: 1fr; }

  .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }

  .kpi-value { font-size: 22px; }

  .modal { max-width: 100%; border-radius: 16px 16px 0 0; margin: auto 0 0 0; }

  .modal-overlay { align-items: flex-end; }

  .table-container { font-size: 12px; }

  thead th, tbody td { padding: 8px 10px; }

  .btn { padding: 7px 12px; font-size: 12px; }

  .lang-tab { padding: 3px 8px; font-size: 11px; }

  .toast-container { bottom: 70px; right: 12px; left: 12px; }

  .page-header { flex-direction: column; align-items: flex-start; }

  .search-bar { max-width: 100%; }

  .filters-bar { flex-direction: column; align-items: stretch; }
}

/* ============================================================
   RESPONSIVE - Small Mobile (≤480px)
   ============================================================ */
@media (max-width: 480px) {
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi-card { padding: 14px; }
  .kpi-value { font-size: 20px; }
  .pipeline-stages { gap: 4px; }
  .header-title { font-size: 15px; }
}

/* -- Setup Screen -- */
.setup-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
}

.setup-card {
  background: white;
  border-radius: 16px;
  box-shadow: var(--shadow-md);
  padding: 40px;
  max-width: 480px;
  width: 100%;
  text-align: center;
}

.setup-card h1 { font-size: 24px; margin-bottom: 12px; }
.setup-card p { color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; }

/* -- Scrollbar styling -- */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #bbb; }
</style>
