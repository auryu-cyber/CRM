<style>
/* ============================================================
   CRM System - Stylesheet (RFQ Split-Panel + Responsive)
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --primary:#1a73e8; --primary-dark:#1557b0; --primary-light:#e8f0fe;
  --green:#137333;   --green-light:#e6f4ea;
  --yellow:#e37400;  --yellow-light:#fef9e7;
  --red:#c5221f;     --red-light:#fce8e6;
  --purple:#6f3fbd;  --purple-light:#f3e8fd;
  --text:#202124;    --text2:#5f6368;  --border:#dadce0;
  --bg:#f8f9fa;      --card:#ffffff;
  --sidebar-w:220px; --header-h:56px;
  --shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
  --shadow-md:0 4px 12px rgba(0,0,0,.15);
  --radius:8px; --trans:.18s ease;
}

html,body{height:100%;font-family:'Noto Sans JP','Noto Sans Thai',Arial,sans-serif;
  font-size:13px;color:var(--text);background:var(--bg);line-height:1.5}

/* ---- LAYOUT ---- */
.app-wrapper{display:flex;height:100vh;overflow:hidden}

/* ---- SIDEBAR ---- */
.sidebar{width:var(--sidebar-w);height:100vh;background:var(--card);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:fixed;left:0;top:0;z-index:200;transition:transform var(--trans);overflow-y:auto}

.sidebar-logo{display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--border);min-height:var(--header-h)}
.logo-icon{width:30px;height:30px;background:var(--primary);border-radius:8px;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.logo-text{font-size:14px;font-weight:600;line-height:1.2}
.logo-sub{font-size:10px;color:var(--text2)}

.sidebar-nav{flex:1;padding:6px 0}
.nav-section-label{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;
  letter-spacing:.8px;padding:10px 16px 4px}

.nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;
  border-radius:0 20px 20px 0;margin-right:10px;color:var(--text2);
  transition:background var(--trans),color var(--trans);
  font-size:13px;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--bg);color:var(--primary)}
.nav-item.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.nav-icon{font-size:16px;min-width:20px;text-align:center}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;
  padding:1px 5px;border-radius:10px;font-weight:600}
.sidebar-footer{border-top:1px solid var(--border);padding:6px 0}

/* ---- MAIN CONTENT ---- */
.main-content{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;
  height:100vh;overflow:hidden}

/* ---- TOP HEADER ---- */
.top-header{height:var(--header-h);background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;z-index:100}
.header-menu-btn{display:none;background:none;border:none;font-size:20px;cursor:pointer;
  color:var(--text2);padding:4px}
.header-title{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Lang Switcher */
.lang-switcher{display:flex;gap:2px;background:var(--bg);border-radius:20px;
  padding:2px;border:1px solid var(--border)}
.lang-tab{padding:3px 9px;border:none;background:none;border-radius:14px;
  cursor:pointer;font-size:11px;color:var(--text2);transition:all var(--trans);font-weight:500}
.lang-tab.active{background:var(--primary);color:#fff;box-shadow:var(--shadow)}
.lang-tab:hover:not(.active){background:var(--border)}

/* User Info */
.user-info{display:flex;align-items:center;gap:8px;cursor:pointer;
  padding:3px 8px;border-radius:20px;transition:background var(--trans)}
.user-info:hover{background:var(--bg)}
.user-avatar{width:30px;height:30px;background:var(--primary);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
.user-name{font-size:12px;font-weight:500}
.user-role{font-size:10px;color:var(--text2)}

/* ---- PAGE CONTENT ---- */
.page-content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ============================================================
   RFQ SPLIT PANEL
   ============================================================ */
.rfq-split{display:flex;height:100%;overflow:hidden}

/* LEFT PANEL */
.rfq-left{width:420px;min-width:280px;display:flex;flex-direction:column;
  border-right:1px solid var(--border);background:var(--card);flex-shrink:0}

.rfq-toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--border)}
.rfq-toolbar .search-bar{flex:1;display:flex;align-items:center;gap:6px;
  background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:5px 12px}
.rfq-toolbar .search-bar input{border:none;outline:none;font-size:13px;
  background:transparent;flex:1;font-family:inherit;color:var(--text)}
.rfq-toolbar .search-bar .search-icon{color:var(--text2);font-size:14px}

/* Status tabs */
.rfq-status-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);
  background:var(--bg);flex-shrink:0}
.rfq-stab{padding:7px 12px;border:none;background:none;cursor:pointer;
  font-size:11px;font-weight:500;color:var(--text2);white-space:nowrap;
  border-bottom:2px solid transparent;font-family:inherit;
  transition:color var(--trans),border-color var(--trans)}
.rfq-stab:hover{color:var(--primary)}
.rfq-stab.active{color:var(--primary);border-bottom-color:var(--primary)}
.rfq-stab-count{display:inline-block;background:var(--border);color:var(--text2);
  font-size:10px;padding:1px 5px;border-radius:8px;margin-left:3px}
.rfq-stab.active .rfq-stab-count{background:var(--primary-light);color:var(--primary)}

/* RFQ list items */
.rfq-list-body{flex:1;overflow-y:auto}
.rfq-list-item{padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background var(--trans)}
.rfq-list-item:hover{background:var(--bg)}
.rfq-list-item.selected{background:var(--primary-light);border-left:3px solid var(--primary)}

.rfq-item-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.rfq-number{font-size:12px;font-weight:600;color:var(--primary);font-family:monospace}
.rfq-imported-badge{font-size:11px;title:"Imported"}
.rfq-item-customer{font-size:12px;font-weight:500;color:var(--text);margin-bottom:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rfq-item-part{font-size:11px;color:var(--text2);margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rfq-item-bottom{display:flex;align-items:center;font-size:11px;color:var(--text2)}
.rfq-list-footer{padding:6px 14px;font-size:11px;color:var(--text2);
  background:var(--bg);border-top:1px solid var(--border);flex-shrink:0}

/* RESIZE DIVIDER */
.rfq-divider{width:4px;cursor:col-resize;background:var(--border);
  transition:background var(--trans);flex-shrink:0}
.rfq-divider:hover,.rfq-divider:active{background:var(--primary)}

/* RIGHT PANEL */
.rfq-right{flex:1;display:flex;flex-direction:column;min-width:320px;overflow:hidden;
  background:var(--card)}
.rfq-right-header{display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-bottom:1px solid var(--border);min-height:46px;flex-shrink:0}
#rfqRightTitle{font-size:14px;font-weight:600;flex:1;color:var(--text)}
.rfq-right-actions{display:flex;gap:6px;flex-shrink:0}
.rfq-right-body{flex:1;overflow-y:auto}

/* Import panel */
.rfq-import-body{padding:16px}
.rfq-import-info{background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:12px;margin-bottom:14px}
.rfq-import-info-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.rfq-import-info-row span{color:var(--text2)}
.rfq-import-info-row strong{color:var(--text)}
.rfq-section-title{font-size:12px;font-weight:600;color:var(--text);
  margin-bottom:8px;display:flex;align-items:center;gap:6px}

/* Column mapping grid */
.rfq-mapping-section{margin-bottom:14px}
.rfq-mapping-grid{display:grid;gap:2px;max-height:180px;overflow-y:auto;
  border:1px solid var(--border);border-radius:6px;background:var(--bg)}
.rfq-mapping-row{display:grid;grid-template-columns:1fr 20px 1fr;gap:4px;
  padding:4px 8px;font-size:11px;align-items:center}
.rfq-mapping-row.mapped{background:#fff}
.rfq-mapping-source{color:var(--text2);truncate:true;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rfq-mapping-arrow{text-align:center;color:var(--green);font-weight:700}
.rfq-mapping-target{color:var(--green);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Preview table */
.rfq-preview-table-wrap{overflow:auto;max-height:280px;border:1px solid var(--border);
  border-radius:6px;margin-bottom:14px}
.rfq-preview-table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
.rfq-preview-table th{background:var(--bg);padding:6px 10px;text-align:left;
  font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);
  position:sticky;top:0}
.rfq-preview-table td{padding:5px 10px;border-bottom:1px solid var(--border);max-width:160px;
  overflow:hidden;text-overflow:ellipsis}
.rfq-preview-table tr:hover td{background:var(--bg)}
.rfq-mapped-cell{background:rgba(52,168,83,.06);color:var(--green)}

/* RFQ Detail */
.rfq-detail{padding:16px}
.rfq-detail-status{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.badge-lg{font-size:13px;padding:5px 14px}
.rfq-imported-badge-lg{font-size:12px;color:var(--text2);background:var(--bg);
  padding:3px 8px;border-radius:12px;border:1px solid var(--border)}
.rfq-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.rfq-detail-row{background:var(--bg);border-radius:6px;padding:8px 10px}
.rfq-detail-label{font-size:10px;color:var(--text2);font-weight:500;margin-bottom:2px}
.rfq-detail-value{font-size:13px;color:var(--text);font-weight:500;
  word-break:break-word}
.rfq-detail-notes{background:var(--bg);border-radius:6px;padding:10px;margin-bottom:14px}
.rfq-detail-note-text{font-size:12px;color:var(--text);line-height:1.6;white-space:pre-wrap}
.rfq-detail-meta{font-size:11px;color:var(--text2);margin-top:12px;
  padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:3px}

/* Stage progress */
.rfq-stage-progress{display:flex;align-items:center;margin-bottom:16px;
  background:var(--bg);border-radius:8px;padding:12px 16px;overflow-x:auto}
.rfq-stage-step{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:60px}
.rfq-stage-dot{width:14px;height:14px;border-radius:50%;background:var(--border);
  border:2px solid var(--border);transition:all var(--trans)}
.rfq-stage-step.done .rfq-stage-dot{background:var(--primary);border-color:var(--primary)}
.rfq-stage-step.current .rfq-stage-dot{background:#fff;border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-light);width:16px;height:16px}
.rfq-stage-label{font-size:10px;color:var(--text2);text-align:center;white-space:nowrap}
.rfq-stage-step.done .rfq-stage-label,.rfq-stage-step.current .rfq-stage-label{color:var(--primary);font-weight:600}
.rfq-stage-line{flex:1;height:2px;background:var(--border);margin-bottom:18px;min-width:20px}

/* RFQ Form */
.rfq-form{padding:16px}

/* ---- STANDARD PAGES (non-split) ---- */
.std-page{padding:20px;max-width:100%;overflow-y:auto;height:100%}
.page-header{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-header h2{font-size:18px;font-weight:600}

/* KPI Grid */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:14px;margin-bottom:18px}
.kpi-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;display:flex;flex-direction:column;gap:6px}
.kpi-label{font-size:11px;color:var(--text2);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.kpi-value{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.kpi-sub{font-size:11px;color:var(--text2)}
.kpi-icon{font-size:28px;margin-bottom:2px}
.kpi-card.blue{border-top:3px solid var(--primary)}
.kpi-card.green{border-top:3px solid var(--green)}
.kpi-card.yellow{border-top:3px solid var(--yellow)}
.kpi-card.red{border-top:3px solid var(--red)}

/* Card */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:16px;margin-bottom:14px}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* Progress */
.progress-bar{height:7px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:width .6s ease}
.progress-fill.green{background:var(--green)}
.progress-fill.yellow{background:var(--yellow)}
.progress-fill.red{background:var(--red)}

/* Table */
.table-container{overflow-x:auto;border-radius:var(--radius);
  box-shadow:var(--shadow);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:var(--bg);padding:9px 12px;text-align:left;
  font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);white-space:nowrap}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.table-actions{display:flex;gap:5px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:6px;
  border:none;cursor:pointer;font-size:12px;font-weight:500;
  transition:all var(--trans);white-space:nowrap;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--primary-dark)}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--border)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover:not(:disabled){background:#a01915}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover:not(:disabled){background:#0d5c2b}
.btn-sm{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.6;cursor:not-allowed}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-blue{background:var(--primary-light);color:var(--primary)}
.badge-green{background:var(--green-light);color:var(--green)}
.badge-yellow{background:var(--yellow-light);color:var(--yellow)}
.badge-red{background:var(--red-light);color:var(--red)}
.badge-purple{background:var(--purple-light);color:var(--purple)}
.badge-gray{background:var(--bg);color:var(--text2)}

/* Forms */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12px;font-weight:500;margin-bottom:5px;color:var(--text)}
.required{color:var(--red);margin-left:2px}
.form-control{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;
  font-size:13px;color:var(--text);background:#fff;transition:border-color var(--trans);font-family:inherit}
.form-control:focus{outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(26,115,232,.12)}
.form-control::placeholder{color:#bbb}
select.form-control{cursor:pointer}
textarea.form-control{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.filters-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search-bar{display:flex;align-items:center;gap:6px;background:#fff;
  border:1px solid var(--border);border-radius:20px;padding:5px 12px}
.search-bar input{border:none;outline:none;font-size:13px;flex:1;font-family:inherit;color:var(--text)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:16px;
  opacity:0;pointer-events:none;transition:opacity var(--trans)}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:#fff;border-radius:12px;box-shadow:var(--shadow-md);width:100%;
  max-width:540px;max-height:90vh;display:flex;flex-direction:column;
  transform:translateY(20px);transition:transform var(--trans)}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:600}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;
  color:var(--text2);padding:3px;border-radius:50%;line-height:1}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:18px 20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px}

/* Toast */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:9999;
  display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;
  font-size:12px;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;
  animation:slideInRight .3s ease;pointer-events:all;max-width:320px}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.warning{background:var(--yellow)}
@keyframes slideInRight{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Spinner */
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
.empty-icon{font-size:40px;margin-bottom:10px}

/* Pipeline stages widget */
.pipeline-stages{display:flex;gap:6px;flex-wrap:wrap}
.pipeline-stage{flex:1;min-width:70px;text-align:center;padding:10px 6px;
  background:var(--bg);border-radius:var(--radius);border:1px solid var(--border)}
.stage-count{font-size:22px;font-weight:700;color:var(--primary)}
.stage-label{font-size:10px;color:var(--text2);margin-top:2px}

/* ============================================================
   RESPONSIVE - Tablet (≤1024px)
   ============================================================ */
@media (max-width:1024px) {
  :root{--sidebar-w:200px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .dash-grid{grid-template-columns:1fr}
  .rfq-left{width:340px}
}

/* ============================================================
   RESPONSIVE - Mobile (≤768px)
   ============================================================ */
@media (max-width:768px) {
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-md)}
  .sidebar-overlay.open{display:block}
  .main-content{margin-left:0}
  .header-menu-btn{display:block}
  .user-name,.user-role{display:none}
  .page-content{padding:0}
  .std-page{padding:12px}
  .form-row{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:8px}

  /* Mobile RFQ: stack panels */
  .rfq-split{flex-direction:column}
  .rfq-left{width:100%;height:50%;min-width:auto;border-right:none;border-bottom:1px solid var(--border)}
  .rfq-right{height:50%}
  .rfq-divider{display:none}

  .modal{max-width:100%;border-radius:16px 16px 0 0;margin:auto 0 0 0}
  .modal-overlay{align-items:flex-end}
  .toast-container{bottom:12px;right:10px;left:10px}
  .rfq-detail-grid{grid-template-columns:1fr}
}

.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#bbb}
</style>
